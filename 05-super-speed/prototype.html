<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rook Dispatch · Farlight</title>
<style>
:root{color-scheme:dark;--bg:#101919;--panel:#192525;--line:#334242;--text:#eff4ed;--muted:#a9b9b4;--lime:#d4f295;--orange:#f0be85}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 'Segoe UI',Arial,sans-serif}button,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:10px 16px;background:#263636;color:var(--text)}button:hover{border-color:var(--lime)}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:var(--lime);color:#17231c;border-color:var(--lime);font-weight:650}.quiet{background:transparent}.top{padding:20px 4vw;display:flex;align-items:center;gap:30px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:3px;font-size:21px}.brand small{font-weight:400;letter-spacing:0;color:var(--muted);margin-left:14px}.top .date{margin-left:auto;color:var(--muted);font-size:14px}.demo{background:#263020;padding:9px 4vw;color:#d6e4c6;font-size:13px;display:flex;gap:18px;align-items:center}.demo button{padding:3px 10px;margin-left:auto;font-size:13px}.shell{display:grid;grid-template-columns:210px 1fr;max-width:1600px;margin:auto;min-height:85vh}.nav{border-right:1px solid var(--line);padding:32px 20px}.nav p{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}.nav button{display:block;width:100%;text-align:left;margin:8px 0;border-color:transparent}.nav button.active{background:#2c3c32;color:var(--lime);border-color:#526444}.main{padding:40px 4vw 60px;min-width:0}.eyebrow{color:var(--lime);font-size:12px;letter-spacing:2px;text-transform:uppercase}h1{font-size:36px;line-height:1.15;letter-spacing:-1px;margin:10px 0}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0 18px}.muted{color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:18px}.pill{font-size:13px;background:#293c2e;color:var(--lime);padding:6px 12px;border-radius:30px;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:25px;margin-bottom:22px}.person{display:flex;gap:16px;align-items:center}.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#45533b;color:var(--lime);font-family:Georgia,serif;font-size:29px}.person h2{margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:24px 0}.stat{border-right:1px solid var(--line)}.stat:last-child{border:0}.stat strong{font-size:32px;display:block;font-weight:500}.stat span{color:var(--muted);font-size:13px}.chart{height:125px;display:flex;gap:22px;align-items:end;margin:25px 0 10px;border-bottom:1px solid var(--line)}.bar{flex:1;background:#94aa7b;border-radius:4px 4px 0 0;position:relative;min-height:3px}.bar:last-child{background:var(--orange)}.bar span{position:absolute;top:-28px;width:100%;text-align:center;font-size:14px}.labels{display:flex;gap:22px;font-size:12px;color:var(--muted)}.labels span{flex:1;text-align:center}table{width:100%;border-collapse:collapse;font-size:14px;margin-top:24px}th,td{padding:10px 7px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:400}th:first-child,td:first-child{text-align:left}.callout{border-left:3px solid var(--orange);padding:4px 0 4px 17px;margin:22px 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.timeline{padding:0;list-style:none}.timeline li{padding:0 0 18px 22px;border-left:1px solid #4a5b50;position:relative;color:var(--muted);font-size:14px}.timeline li:before{content:'';position:absolute;left:-4px;top:7px;width:7px;height:7px;background:var(--lime);border-radius:50%}.timeline strong{display:block;color:var(--text)}.phone{max-width:370px;margin:0 auto;background:#101818;border:7px solid #3d4844;border-radius:38px;padding:28px 22px;min-height:540px;box-shadow:0 25px 60px #0004}.phone .person{margin:25px 0}.phone h2{font-size:27px}.phone button{width:100%;margin-bottom:10px}.phone-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.phone-note{font-size:13px;color:var(--muted)}.check{padding:12px;background:#24342b;border-radius:7px;margin:12px 0;color:#d8e6cd}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}select{width:100%;background:#243333;color:var(--text);padding:12px;border:1px solid var(--line);border-radius:6px;margin:8px 0 14px}label{display:block}footer{color:var(--muted);font-size:12px;margin-top:28px}a{color:var(--lime)}#notice{position:fixed;bottom:20px;right:20px;max-width:440px;background:var(--lime);color:#17231c;padding:14px 20px;border-radius:8px;box-shadow:0 10px 30px #0008;display:none}.tag{color:var(--orange);font-size:13px}.wide{max-width:850px}.sr{position:absolute;left:-10000px}@media(max-width:1000px){.layout,.review-grid{grid-template-columns:1fr}.shell{grid-template-columns:160px 1fr}.main{padding:26px}.top .date{display:none}}@media(max-width:650px){.shell{display:block}.nav{display:flex;padding:10px;gap:5px;border-right:0;border-bottom:1px solid var(--line)}.nav p{display:none}.nav button{font-size:13px;padding:9px;text-align:center;margin:0}.main{padding:22px 16px}.top{padding:15px}.brand small{font-size:13px}.heading{align-items:start}h1{font-size:29px}.card{padding:19px}.demo{padding:9px 15px}.stats{gap:8px}.stat strong{font-size:27px}}

.roster-tools{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin:22px 0}.roster-tools label{flex:1;min-width:180px;font-size:13px;color:var(--muted)}.roster-tools input{display:block;width:100%;margin-top:8px;padding:12px;background:#243333;color:var(--text);border:1px solid var(--line);border-radius:6px;font:inherit}.roster-tools select{margin-bottom:0}.roster-tools input:focus-visible{outline:3px solid var(--orange)}.roster-table{min-width:660px;margin:0}.roster-table th,.roster-table td{text-align:left;padding:16px 12px}.roster-table td:last-child{text-align:right}.roster-table tbody tr:hover{background:#213030}.roster-table .pill{display:inline-block}.pill.engaged{color:#b8d8ff;background:#293c4a}.pill.unavailable{color:#c3c7c5;background:#343b39}.roster-name{font-weight:650}.roster-sub{font-size:12px;color:var(--muted)}.overview-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.overview-stats .card{margin:0}.overview-stats strong{display:block;font-size:30px;font-weight:500}.table-scroll{overflow-x:auto}.roster-detail{border-top:1px solid var(--line);margin-top:20px;padding-top:22px}@media(max-width:650px){.overview-stats{grid-template-columns:1fr 1fr}.overview-stats .card{padding:14px}.nav{flex-wrap:wrap}.nav button{width:calc(50% - 5px)}}

</style>
</head>
<body>
<header class="top"><div class="brand">ROOK <small>Dispatch</small></div><span class="date">Coverage console · September 7, 2026</span></header>
<div class="demo"><span>Interactive prototype · fictional data · proposed recovery policy</span><button id="reset">Reset demo</button></div>
<div class="shell"><nav class="nav" aria-label="Prototype views"><p>View as</p><button data-view="dashboard">Dispatcher dashboard</button><button data-view="handler">Farlight’s coverage</button><button data-view="review">Support review</button><button data-view="phone">Farlight’s phone</button></nav><main class="main" id="main"></main></div>
<div id="notice" role="status" aria-live="polite"></div>
<script>
const initial=()=>({view:'dashboard',query:'',filter:'all',selected:null,stage:'quiet',scenario:'supported',support:false,engineering:false,confirmed:false,corrected:false,offers:0,taken:0,missed:0,declined:0,eligible:0,escalated:false,paused:false,pending:false,log:[]});
let state=initial();
const stageNames={quiet:'No active review',requested:'Review requested',blocked:'We need more information',noDemand:'No suitable callouts found',unavailable:'Availability needs review',awaiting:'Waiting for Farlight',paused:'Participation paused',expired:'Confirmation expired',confirmed:'Ready for correction',monitoring:'Watching for suitable offers'};
function note(message){const n=document.getElementById('notice');n.textContent=message;n.style.display='block';clearTimeout(note.timer);note.timer=setTimeout(()=>n.style.display='none',5000)}
function log(message){state.log.unshift(message)}
function go(view){state.view=view;render();document.getElementById('main').focus()}
function status(){return state.escalated?'Technical review continuing':state.pending?'Correction pending':stageNames[state.stage]}
function timeline(){return state.log.length?'<ul class="timeline">'+state.log.map(x=>'<li><strong>'+x+'</strong>Demo activity · September 7</li>').join('')+'</ul>':'<p class="muted">A request and its updates will appear here.</p>'}
function heading(kicker,title,subtitle){return '<div class="heading"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p class="muted">'+subtitle+'</p></div></div>'}
function button(action,text,primary=false,disabled=false){return '<button data-action="'+action+'" class="'+(primary?'primary':'quiet')+'" '+(disabled?'disabled':'')+'>'+text+'</button>'}
function handler(){return heading('Coverage / Responder','Farlight','One responder. A clear view of offers, answers, and what happens next.')+'<div class="layout"><section><div class="card"><div class="person"><div class="avatar" aria-hidden="true">F</div><div><h2>Farlight</h2><span class="muted">Responder profile</span></div><span class="pill" style="margin-left:auto">Available</span></div><div class="stats"><div class="stat"><strong>0</strong><span>Offers last full week</span></div><div class="stat"><strong>12</strong><span>Typical week before 4.2</span></div><div class="stat"><strong>Aug 28</strong><span>Last recorded offer</span></div></div><h3>Offers over the last four weeks</h3><div class="chart" aria-hidden="true"><div class="bar" style="height:100%"><span>10</span></div><div class="bar" style="height:30%"><span>3</span></div><div class="bar" style="height:10%"><span>1</span></div><div class="bar" style="height:3px"><span>0</span></div></div><div class="labels"><span>Aug 10</span><span>Aug 17</span><span>Aug 24</span><span>Aug 31</span></div><table><caption class="sr">Weekly ping outcomes, weeks starting Monday</caption><thead><tr><th>Week of</th><th>Offers</th><th>Taken</th><th>Missed</th><th>Declined</th></tr></thead><tbody><tr><td>Aug 10</td><td>10</td><td>4</td><td>4</td><td>2</td></tr><tr><td>Aug 17</td><td>3</td><td>0</td><td>2</td><td>1</td></tr><tr><td>Aug 24</td><td>1</td><td>0</td><td>1</td><td>0</td></tr><tr><td>Aug 31</td><td>0</td><td>0</td><td>0</td><td>0</td></tr></tbody></table><footer>Historical weekly counts from Module 3. Aug 10 includes release day. Availability is a sample current state.</footer></div><div class="card"><h2>Something doesn’t look right?</h2><p class="muted">Ask us to check whether suitable offers are reaching Farlight. A quiet week alone doesn’t tell us why.</p>'+button('request',state.stage==='quiet'?'Review my offers':'Review already requested',true,state.stage!=='quiet')+'</div></section><aside><div class="card"><span class="tag">Offer review</span><h2 style="margin-top:8px">'+status()+'</h2>'+handlerMessage()+'</div><div class="card"><h2>Activity</h2>'+timeline()+'</div></aside></div>'}
function handlerMessage(){if(state.stage==='quiet')return '<p class="muted">No review is open. Request one from the coverage card.</p>';let message='<p>Owner: '+(state.escalated||state.stage==='blocked'||state.pending?'Marcus · Engineering':'Nadia · Support')+'</p><p class="muted">Next update: September 9. This is an update date, not a promise of resolution.</p>';if(state.stage==='awaiting')message+='<p>The review is complete. Farlight can choose whether to participate in her phone app.</p>'+button('phone','Preview her phone');if(state.stage==='paused')message+='<p>Farlight chose “Not now.” Her history has not been changed.</p>'+button('resume','Ask to resume');if(state.stage==='expired')message+='<p>The invitation expired. Support needs fresh approvals before sending another.</p>';if(state.stage==='noDemand')message+='<p>No suitable callouts found for September 1–7. Support will update this review on September 9.</p>';if(state.stage==='unavailable')message+='<p>Demo records show unavailable periods on September 1–7. Check the recorded availability with Support.</p>';if(state.stage==='blocked')message+='<p>Historical ranking evidence is incomplete. Engineering is gathering evidence; no correction has been applied.</p>';if(state.corrected)message+='<div class="check">History corrected. Monitoring continues for 14 days.</div><p>Since correction: '+state.offers+' offers · '+state.taken+' taken · '+state.missed+' missed · '+state.declined+' declined.</p><p class="muted">New misses are recorded without a score penalty during this proposed pilot. Deliberate declines still affect the score. No work is guaranteed.</p>';if(state.escalated)message+='<p>We’re checking why recovery has not continued. No repeated score reset will be applied.</p>';return message}
function review(){return heading('Support workspace','Offer review','Farlight · Sample evidence for exploring the proposed process.')+'<div class="review-grid"><section class="card"><h2>'+status()+'</h2><p class="muted">Nadia reviews the evidence. Marcus verifies the technical replay. Neither can confirm for Farlight.</p><label for="scenario">Sample review finding</label><select id="scenario" '+(state.stage!=='requested'?'disabled':'')+'><option value="supported">Miss penalties affected an opportunity</option><option value="missing">Historical evidence is missing</option><option value="demand">No suitable callouts</option><option value="unavailable">Unavailable during the period</option></select><div class="callout"><strong>Illustrative evidence, not a database finding</strong><p>7 days without an offer; 3 eligible callouts; complete history from August 13. Replaying one callout puts Farlight ahead of the responder who accepted. Actual receipt or acceptance cannot be inferred.</p></div><div class="actions">'+button('support',state.support?'Support approved':'Approve as Nadia',false,state.stage!=='requested'||state.support)+button('engineering',state.engineering?'Replay approved':'Approve as Marcus',false,state.stage!=='requested'||state.engineering)+button('finding','Finish review',true,state.stage!=='requested'||(state.scenario==='supported'&&(!state.support||!state.engineering)))+'</div>'+((state.stage==='awaiting')?'<div class="actions">'+button('phone','Continue on Farlight’s phone',true)+button('expire','Simulate seven-day expiry')+'</div>':'')+((state.stage==='expired')?'<div class="actions">'+button('reapprove','Restart evidence approval',true)+'</div>':'')+((state.stage==='confirmed')?'<div class="check">Farlight confirmed. Apply the correction and pilot miss rule together.</div><div class="actions">'+button('apply','Apply approved correction',true)+button('fail','Simulate write failure')+'</div>':'')+(state.pending?'<div class="actions">'+button('apply','Retry correction',true)+'</div>':'')+'</section><section class="card"><h2>Follow the recovery</h2><p class="muted">Simulation controls become available after the correction. These generate sample outcomes, not live callouts.</p><div class="stats"><div class="stat"><strong>'+state.offers+'</strong><span>Offers</span></div><div class="stat"><strong>'+state.taken+'</strong><span>Taken</span></div><div class="stat"><strong>'+state.eligible+'</strong><span>Consecutive eligible callouts without offer</span></div></div><div class="actions">'+button('offer','Send sample offer',true,!state.corrected||state.paused)+button('nooffer','Eligible callout, no offer',false,!state.corrected||state.paused)+button('seven','Advance seven days without offer',false,!state.corrected||state.paused)+'</div><p class="muted">Three eligible callouts without an offer, seven days without an offer, or a new miss escalates to Marcus. A first acceptance does not end monitoring.</p><h3>Correction record</h3><p>'+ (state.corrected?'DEMO-FARLIGHT-001 · applied once. Sample replay score 0.00 → 0.48. Approved by Nadia and Marcus; confirmed by Farlight.':'No correction committed.')+'</p><footer>Score values and review evidence are illustrative. Production history, safe concurrent updates, and app support still require verification.</footer></section></div>'}
function phoneStatus() {
    if (state.paused && state.corrected) return 'Participation ended';
    if (state.offering) return 'New suitable offer';
    return status();
}
function phone() {
    let body = '';
    const owner = state.escalated || state.pending || state.stage === 'blocked' ? 'Marcus · Engineering' : 'Nadia · Support';
    if (state.paused && state.corrected) {
        body = '<h2>You’ve left the pilot</h2><p>Your approved history correction remains. Future missed offers follow the usual scoring rules again.</p><p class="phone-note">Your availability has not changed. Contact Support through your handler if you want to discuss what happens next.</p>';
    } else if (state.offering) {
        body = '<span class="pill">Sample callout · 60-second offer window</span><h2 style="margin-top:25px">A suitable offer</h2><p>Nearby incident requiring capabilities that match your profile.</p><p class="phone-note">This demo does not start a real timer. Choose an outcome to explore the next screen.</p>' + button('accept','Take offer',true) + button('decline','Turn down') + button('miss','Simulate missed offer');
    } else if (state.pending) {
        body = '<h2>Your correction is delayed</h2><p>You confirmed, but the update has not completed. Your score has not changed and pilot protection has not started.</p><p>Marcus is checking the problem. You don’t need to confirm again.</p>';
    } else if (state.stage === 'awaiting') {
        body = '<h2>A route back to suitable offers</h2><p>Our sample review found missed offers pushed you below someone who accepted a suitable callout.</p><p>We can correct those miss penalties and try a different rule for new misses for 14 days.</p><p class="phone-note">Work is not guaranteed. Explicit declines still affect your score. Your availability stays under your control. Confirmation expires September 14. You can leave the pilot at any time.</p>' + button('confirm','Confirm participation',true) + button('later','Not now');
    } else if (state.stage === 'confirmed') {
        body = '<h2>You’ve confirmed</h2><p>We’re preparing your approved correction. We’ll tell you when it is complete and the pilot starts.</p><p class="phone-note">You don’t need to take another step right now.</p>';
    } else if (state.corrected) {
        body = '<h2>' + (state.escalated ? 'We’re checking your offers again' : state.taken ? 'You took an offer' : 'Watching for suitable offers') + '</h2>';
        body += state.escalated ? '<p>Your recovery needs another check. Marcus is investigating delivery, availability and your position in the offer list. We won’t repeatedly reset your history.</p>' : state.taken ? '<p>Your acceptance is recorded. We’ll keep monitoring for the full pilot to see whether suitable offers continue reaching you.</p>' : '<p>Your reviewed history has been corrected. We’re watching whether suitable offers reach you.</p>';
        body += '<div class="stats"><div class="stat"><strong>' + state.offers + '</strong><span>Offers</span></div><div class="stat"><strong>' + state.taken + '</strong><span>Taken</span></div><div class="stat"><strong>' + state.missed + '</strong><span>Missed</span></div></div><p class="phone-note">Since your correction · ' + state.declined + ' explicitly declined. New misses are recorded without subtracting points during this pilot. Deliberate declines still affect your score. Work is not guaranteed.</p>' + button('withdraw','Leave pilot');
    } else {
        const messages = {
            requested: ['Your review is underway','Your handler asked us to check your quiet stretch. Support is reviewing suitable callouts, availability and whether offers reached you. You don’t need to do anything yet.'],
            blocked: ['We need more information','We don’t have enough historical evidence to explain your missing offers. Marcus is investigating. No correction has been applied.'],
            noDemand: ['No suitable callouts found','For September 1–7, the review found no callouts matching your recorded availability and capabilities. Support will check in with you again.'],
            unavailable: ['Check your availability with us','The sample review found unavailable periods during September 1–7. Ask your handler to check these records with Support. We have not changed your availability.'],
            paused: ['You chose not now','Your participation is paused and your history has not changed. Ask your handler to resume the review when you are ready.'],
            expired: ['Your invitation expired','The seven-day confirmation window ended. Support needs fresh approvals before sending you another invitation. Your history has not changed.'],
            quiet: ['Your offers','Your handler can ask Support to review an unexplained quiet stretch. A quiet week alone doesn’t tell us why.']
        };
        const message = messages[state.stage] || messages.quiet;
        body = '<h2>' + message[0] + '</h2><p>' + message[1] + '</p>';
    }
    const hasReview = state.stage !== 'quiet';
    const followup = hasReview ? '<div style="border-top:1px solid var(--line);margin-top:24px;padding-top:16px"><h3>Your next update</h3><p class="phone-note">' + owner + '<br>September 9 · An update, even if the investigation is still open.</p></div>' : '';
    const activity = state.log.length ? '<details style="margin-top:18px"><summary style="cursor:pointer;color:var(--lime)">Recent updates</summary><p class="phone-note">' + state.log.slice(0,3).join('</p><p class="phone-note">') + '</p></details>' : '';
    return heading('Responder app','Farlight’s phone','Your review status updates as the demo moves forward.') + '<div class="phone"><div class="phone-head"><span>9:41</span><span>ROOK DISPATCH</span></div><div class="person"><div class="avatar">F</div><div>Farlight<br><span class="pill">Available · sample status</span></div></div><div role="status" aria-live="polite" class="check" style="margin-bottom:22px">' + phoneStatus() + '</div>' + body + followup + activity + '</div><p class="muted" style="text-align:center;margin-top:20px;font-size:13px">Prototype controls: use Support review to advance sample events.</p>';
}

const roster = [
    ['Captain Vantage','Available'],['Cindermark','Engaged'],['Corporal Ashgrove','Available'],
    ['Farlight','Available'],['Halfmoon','Unavailable'],['Ironvale','Available'],
    ['Meteor Mite','Available'],['Nightwell','Engaged'],['Sgt. Bulwark','Available'],
    ['Sgt. Falkirk','Engaged'],['Stormwrack','Available'],['The Drift','Unavailable'],
    ['The Gale','Engaged'],['The Longcast','Available'],['The Undertow','Available'],['Vesper','Unavailable']
];
function dashboard() {
    const counts = {Available:0,Engaged:0,Unavailable:0};
    roster.forEach(r => counts[r[1]]++);
    const matching = roster.filter(r => r[0].toLowerCase().includes(state.query.toLowerCase()) && (state.filter === 'all' || r[1] === state.filter));
    const rows = matching.map(r => {
        const isFarlight = r[0] === 'Farlight';
        const review = isFarlight ? (state.paused && state.corrected ? 'Participation ended' : status()) : 'No review in this demo';
        const detail = r[1] === 'Available' ? 'Ready for suitable offers' : r[1] === 'Engaged' ? 'Assigned to a callout' : 'Not receiving offers';
        return '<tr><td><div class="roster-name">' + r[0] + '</div><div class="roster-sub">Responder</div></td><td><span class="pill ' + r[1].toLowerCase() + '">' + r[1] + '</span></td><td>' + detail + '</td><td>' + review + '</td><td><button data-responder="' + r[0] + '">View</button></td></tr>';
    }).join('');
    let detail = '';
    if (state.selected) {
        const responder = roster.find(r => r[0] === state.selected);
        detail = '<section class="roster-detail" aria-live="polite"><h2>' + responder[0] + '</h2><p><span class="pill ' + responder[1].toLowerCase() + '">' + responder[1] + '</span></p><p>' + (responder[1] === 'Engaged' ? 'Assigned to a callout. They are not available for another offer.' : responder[1] === 'Unavailable' ? 'Not available for new offers. This view does not change their availability.' : 'Available for suitable offers. Being available does not guarantee an offer.') + '</p><p class="muted">This is a sample current status. Detailed callout records and recovery journeys are only demonstrated for Farlight.</p></section>';
    }
    return heading('Dispatch / Coverage','Responder overview','See who is available, who is engaged, and who needs follow-up.') +
        '<p class="tag">All availability states below are illustrative, not a live database feed.</p>' +
        '<div class="overview-stats"><div class="card"><span class="muted">Responders</span><strong>' + roster.length + '</strong></div><div class="card"><span class="muted">Available</span><strong>' + counts.Available + '</strong></div><div class="card"><span class="muted">Engaged</span><strong>' + counts.Engaged + '</strong></div><div class="card"><span class="muted">Unavailable</span><strong>' + counts.Unavailable + '</strong></div></div>' +
        '<section class="card" style="margin-top:24px"><h2>All responders</h2><div class="roster-tools"><label for="roster-search">Find a responder<input type="search" id="roster-search" placeholder="Search by name" autocomplete="off"></label><label for="roster-filter">Availability<select id="roster-filter"><option value="all">All statuses</option><option>Available</option><option>Engaged</option><option>Unavailable</option></select></label><button data-action="clearfilters">Clear filters</button></div><p class="muted" aria-live="polite">Showing ' + matching.length + ' of ' + roster.length + ' responders</p><div class="table-scroll"><table class="roster-table"><caption class="sr">Responder availability and recovery review status</caption><thead><tr><th>Name</th><th>Availability</th><th>Dispatch status</th><th>Offer review</th><th><span class="sr">Details</span></th></tr></thead><tbody>' + (rows || '<tr><td colspan="5">No responders match. Clear filters or try another name.</td></tr>') + '</tbody></table></div>' + detail + '</section>';
}
function renderDashboardControls() {
    const search = document.getElementById('roster-search');
    const filter = document.getElementById('roster-filter');
    if (search) search.value = state.query;
    if (filter) filter.value = state.filter;
}

function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===state.view);b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false')});document.getElementById('main').innerHTML=state.view==='dashboard'?dashboard():state.view==='handler'?handler():state.view==='review'?review():phone();document.getElementById('main').setAttribute('tabindex','-1');const s=document.getElementById('scenario');if(s)s.value=state.scenario;renderDashboardControls()}
function escalate(reason){state.escalated=true;log('Escalated to Marcus: '+reason)}
function act(a){switch(a){case'clearfilters':state.query='';state.filter='all';state.selected=null;break;case'handler':case'review':case'phone':go(a);return;case'request':if(state.stage!=='quiet')return;state.stage='requested';log('Review requested · Nadia owns the next update');note('Request received. Explore Support review next.');break;case'support':state.support=true;log('Nadia approved the sample evidence');break;case'engineering':state.engineering=true;log('Marcus approved the sample replay');break;case'finding':if(state.scenario==='supported'&&state.support&&state.engineering){state.stage='awaiting';log('Invitation sent to Farlight')}else if(state.scenario!=='supported'){state.stage={missing:'blocked',demand:'noDemand',unavailable:'unavailable'}[state.scenario];log(stageNames[state.stage])}break;case'expire':if(state.stage!=='awaiting')return;state.stage='expired';state.support=false;state.engineering=false;log('Invitation expired; fresh approvals required');break;case'reapprove':state.stage='requested';log('Evidence approval restarted');break;case'confirm':if(state.stage!=='awaiting')return;state.stage='confirmed';state.confirmed=true;log('Farlight confirmed participation');break;case'later':if(state.stage!=='awaiting')return;state.stage='paused';log('Farlight chose Not now');break;case'resume':state.stage='requested';state.support=false;state.engineering=false;log('New approval requested before another invitation');break;case'fail':if(state.stage!=='confirmed')return;state.pending=true;state.stage='pending';log('Write failed · no score change; Marcus notified');break;case'apply':if(!state.confirmed||state.corrected||!state.support||!state.engineering)return;state.corrected=true;state.pending=false;state.stage='monitoring';log('DEMO-FARLIGHT-001 committed · correction and miss rule active');note('Correction applied once. Explore the recovery controls.');break;case'offer':if(!state.corrected||state.paused||state.offering)return;state.offering=true;state.offers++;state.eligible=0;log('Sample suitable offer sent');go('phone');return;case'accept':case'decline':case'miss':if(!state.offering)return;state.offering=false;if(a==='accept'){state.taken++;log('Offer taken · acceptance credit earned; monitoring continues')}if(a==='decline'){state.declined++;log('Offer explicitly declined · existing penalty retained')}if(a==='miss'){state.missed++;escalate('missed offer; no pilot miss penalty')}break;case'nooffer':if(!state.corrected||state.paused)return;state.eligible++;if(state.eligible===3)escalate('three eligible callouts without an offer');else log('Eligible callout completed before reaching Farlight');break;case'seven':if(!state.corrected||state.paused)return;escalate('seven days without an offer');break;case'withdraw':if(!state.corrected||state.paused)return;state.paused=true;state.offering=false;log('Farlight left the pilot · prospective miss protection ended');note('Participation ended. Approved historical correction remains.');break;}render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.view)go(b.dataset.view);if(b.dataset.action)act(b.dataset.action)});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){state.scenario=e.target.value;state.support=false;state.engineering=false;render()}});
document.getElementById('reset').addEventListener('click',()=>{state=initial();render();note('Demo reset. No live records were changed.')});

document.addEventListener('input', e => {
    if (e.target.id !== 'roster-search') return;
    const cursor = e.target.selectionStart;
    state.query = e.target.value;
    render();
    const search = document.getElementById('roster-search');
    search.focus();
    search.setSelectionRange(cursor, cursor);
});
document.addEventListener('change', e => {
    if (e.target.id !== 'roster-filter') return;
    state.filter = e.target.value;
    state.selected = null;
    render();
    document.getElementById('roster-filter').focus();
});
document.addEventListener('click', e => {
    const button = e.target.closest('[data-responder]');
    if (!button) return;
    if (button.dataset.responder === 'Farlight') { go('handler'); return; }
    state.selected = button.dataset.responder;
    render();
    document.querySelector('.roster-detail')?.scrollIntoView({behavior:'smooth',block:'nearest'});
});

render();
</script>
</body>
</html>
